<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="/docs/CSS/styles.css">
    <script src="/docs/script/script.js" defer></script>
</head>
<body>
    <form action="cadastroRealizado.html" method="POST">
        <h2>Formulário de Inscrição</h2>
        <fieldset>
            <legend>1. Dados Pessoais</legend>
            <div class="form-grup">
                <label for="nome">Nome Completo*</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: Vitoria">
            </div>
            <div class="form-grup">
                <label for="email">Email*</label>
                <input type="email" id="email" name="email" required placeholder="vitoria@exemple.com">
            </div>
            <div class="form-grup">
                <label for="telefone">Telefone</label>
                <input type="number" name="telefone" id="telefone" name="telefone" placeholder="(00) 00000-0000"
                    pattern="\[0-9]\{2}\s?[0-9\]{4,5}-?[0-9\]{4}">
            </div>
            <div class="form-grup">
                <label for="nascimento">Nascimento*</label>
                <input type="date" id="nascimento" name="nascimento" max="2026-09-09" required>
            <div class="form-grup">
                <label for="cpf">CPF*</label>
                <input type="number" id="cpf" name="cpf" required placeholder="000.000.000-00"
                pattern="\[0-9]\{3}.?[0-9\]{3}.?[0-9\]{3}-?[0-9\]{2}">
            </div>
            
        </fieldset>

        <fieldset>
            <legend>2. Preferências Pessoais</legend>
                <div class="form-grup">
                    <label for="area">Área de Interesse*</label>
                    <select name="area" id="area" required>
                        <option value="">Selecione</option>
                        <option value="frontend">Desenvimento Frontend</option>
                        <option value="backend">Desenvimento Dackend</option>
                        <option value="disingn">UI/UX</option>
                        <option value="mobile">Desenvolvimento Mobile</option>
                        <option value="science">Ciência de Dados</option>
                    </select>                   
                </div>

                <div class="form-grup">
                    <label for="experiencia">Nivel de Experiência:</label>
                    <input type="radio" id="ex-iniciante" name="nivel" value="iniciante" checked required>
                    <label for="ex-iniciante">Iniciante</label>
                    <input type="radio" id="ex-intermediario" name="nivel" value="intermediario">
                    <label for="ex-intermediario">Intermediário</label>
                    <input type="radio" id="ex-avancado" name="nivel" value="avancado">
                    <label for="ex-avancado">Avançado</label>              
                </div>

                <div class="form-grup">
                    <label for="bio">Apresentação / Biografia:</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Conte um pouco sobre você..."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>3.Redes Sociais</legend>
                <div class="form-grup">
                <label for="nome">Instagram</label>
                <input type="url" id="instagram" name="instagram" placeholder="https://instagram.com">
            </div>
            <div class="form-grup">
                <label for="email">GitHub</label>
                <input type="url" id="github" name="github" placeholder="https://github.com">
            </div>
            </fieldset>

                <div class="form-grup">
                    <label for="newsletter">Deseja receber nossa newsletter?</label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">
                        Deseja receber a novidades e atualizações por e-mail.
                    </label>
                </div>

                <div class="form-grup">
                    <button type="submit">Concluir Cadastro</button>
                    <button type="reset">Limpar</button>
                </div>

    </form>
    </form>
    
</body>
</html>
